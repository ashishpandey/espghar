substitutions:
  devicename: br-ac-esp32
  long_devicename: Bedroom AC ESP32
  pcb_version: "P11-PTH-C3 250214"
    
esphome:
  name: "${devicename}"
  name_add_mac_suffix: false
  comment: "${long_devicename} ${pcb_version}"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
  variant: ESP32C3

external_components:
  source: github://DomiStyle/esphome-panasonic-ac
  components: [panasonic_ac]
  
wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password
  ap:
    ssid: "${devicename} Hotspot"
    password: !secret esphome_ap_password
    
  output_power: 8.5dB
  power_save_mode: none
  fast_connect: on
  min_auth_mode: WPA2
captive_portal:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${devicename} IP Address"
    ssid:
      name: "${devicename} Connected SSID"
    bssid:
      name: "${devicename} Connected BSSID"
    mac_address:
      name: "${devicename} MAC Address"
    scan_results:
      name: "${devicename} WiFi Scan Results"
    power_save_mode:
      name: "${devicename} Wifi Power Save Mode"
      
web_server:
  port: 80
  
logger:
  level: DEBUG

api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret ota_password

bluetooth_proxy:

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  id: ac_uart
  baud_rate: 9600
  parity: EVEN

switch:
  - platform: restart
    name: "$long_devicename Restart"
  
climate:
  - platform: panasonic_ac
    id: bedroom
    type: cnt
    name: "$long_devicename"
    vertical_swing_select:
      name: "$long_devicename Vertical Swing Mode"
    outside_temperature:
      name: "$long_devicename Outside Temperature"
    current_power_consumption:
      id: power_consumption_office
      name: "$long_devicename Power Consumption"
      unit_of_measurement: W
      accuracy_decimals: 0
      device_class: power
      state_class: measurement

sensor:
  - platform: total_daily_energy
    name: "$long_devicename Total Daily Energy"
    power_id: power_consumption_office
    filters:
        - multiply: 0.001
    unit_of_measurement: kWh
    device_class: energy

time:
  - platform: homeassistant
    id: my_time