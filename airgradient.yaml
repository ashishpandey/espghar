packages:
  base: !include common/.base.yaml
  esp_info: !include common/.esp-info.yaml

esphome:
  name: airgradient
  name_add_mac_suffix: false
  friendly_name: airgradient

logger:
  level: debug

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_mode: dio
  framework:
    type: esp-idf

wifi:
  output_power: 8.5db
  power_save_mode: none
  fast_connect: on

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  id: bus_a
  frequency: 50kHz # Lower frequency helps stability on super mini boards
  sda_pullup_enabled: true
  scl_pullup_enabled: true

uart:
  - rx_pin: GPIO8
    tx_pin: GPIO9
    baud_rate: 9600
    id: uart1
  - rx_pin: D4
    tx_pin: D3
    baud_rate: 9600
    id: uart2

sensor:
  - platform: sht3xd
    temperature:
      id: temp
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
    address: 0x44
    update_interval: 5s
  - platform: pmsx003
    type: PMSX003
    uart_id: uart1
    pm_2_5:
      id: pm25
      name: "Particulate Matter <2.5µm Concentration"
  - platform: senseair
    uart_id: uart2
    co2:
      id: co2
      name: "SenseAir CO2 Value"
    update_interval: 60s

font:
  - file: "fonts/helvetica.ttf"
    id: helvetica
    size: 12
    glyphs: |
      !"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyzµ³/

display:
  - platform: ssd1306_i2c
    model: "SSD1306 64x48"
    address: 0x3C
    lambda: |-
      it.printf(0, 0, id(helvetica), "%.1f°C", id(temp).state);
      it.printf(0, 12, id(helvetica), "%.1f%% RH", id(humidity).state);
      it.printf(0, 24, id(helvetica), "%.0fppm", id(co2).state);
      it.printf(0, 36, id(helvetica), "%.0f µg/m³", id(pm25).state);

