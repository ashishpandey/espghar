substitutions:
  name: airgradient
  friendly_name: airgradient
  ip_prefix: !secret ip_prefix
  ip_suffix: 213

packages:
  base: !include common/.base.yaml
  esp_info: !include common/.esp-info.yaml

esphome:
  name: airgradient
  name_add_mac_suffix: false
  friendly_name: airgradient

logger:
  level: debug

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_mode: dio
  framework:
    type: esp-idf

wifi:
  output_power: 8.5db
  power_save_mode: none
  fast_connect: on

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  id: bus_a
  frequency: 50kHz # Lower frequency helps stability on super mini boards
  sda_pullup_enabled: true
  scl_pullup_enabled: true

uart:
  - rx_pin: GPIO9
    tx_pin: GPIO8
    baud_rate: 9600
    id: uart_plantair   # platair
  - rx_pin: GPIO2
    tx_pin: GPIO0
    baud_rate: 9600
    id: uart_sensair   # sensair S8

sensor:
  - platform: sht4x
    temperature:
      id: temp
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
    # address: 0x44
    update_interval: 5s
  - platform: pmsx003
    type: PMSX003
    uart_id: uart_plantair
    pm_2_5:
      id: pm25
      name: "Particulate Matter <2.5µm Concentration"
  - platform: senseair
    uart_id: uart_sensair
    co2:
      id: co2
      name: "SenseAir CO2 Value"
    update_interval: 60s

font:
  - file: "gfonts://Roboto"
    id: small
    size: 10
    glyphs: " %/³gmµp"
  - file: "gfonts://Roboto"
    id: large
    size: 24
  - file: "gfonts://Silkscreen"
    id: medium
    size: 15

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.line(63, 0, 63, 63);

      if (id(temp).has_state()) {
        it.printf(0, 0, id(medium), TextAlign::TOP_LEFT, "%.1f°C", id(temp).state);
      }
      if (id(humidity).has_state()) {
        it.printf(127, 0, id(medium), TextAlign::TOP_RIGHT, "%.1f%%", id(humidity).state);
      }

      if (id(co2).has_state()) {
        it.printf(0, 44, id(large), TextAlign::BASELINE_LEFT, "%.0f", id(co2).state);
        it.printf(5, 52, id(small), TextAlign::TOP_LEFT, "ppm");
      }

      if (id(pm25).has_state()) {
        it.printf(127, 44, id(large), TextAlign::BASELINE_RIGHT, "%.1f", id(pm25).state);
        it.printf(127, 52, id(small), TextAlign::TOP_RIGHT, "µg/m³");
      }


