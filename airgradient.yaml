packages:
  base: !include common/.base.yaml
  esp_info: !include common/.esp-info.yaml

esphome:
  name: airgradient
  name_add_mac_suffix: false
  friendly_name: airgradient

logger:
  level: debug

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_mode: dio
  framework:
    type: esp-idf

wifi:
  output_power: 8.5db
  power_save_mode: none
  fast_connect: on

ld2410:

i2c:
  sda: D2
  scl: D1

uart:
  - rx_pin: D5
    tx_pin: D6
    baud_rate: 9600
    id: uart1
  - rx_pin: D4
    tx_pin: D3
    baud_rate: 9600
    id: uart2

sensor:
  - platform: sht3xd
    temperature:
      id: temp
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
    address: 0x44
    update_interval: 5s
  - platform: pmsx003
    type: PMSX003
    uart_id: uart1
    pm_2_5:
      id: pm25
      name: "Particulate Matter <2.5µm Concentration"
  - platform: senseair
    uart_id: uart2
    co2:
      id: co2
      name: "SenseAir CO2 Value"
    update_interval: 60s
