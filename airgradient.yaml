packages:
  base: !include common/.base.yaml
  esp_info: !include common/.esp-info.yaml

esphome:
  name: airgradient
  name_add_mac_suffix: false
  friendly_name: airgradient

logger:
  level: debug

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_mode: dio
  framework:
    type: esp-idf

wifi:
  output_power: 8.5db
  power_save_mode: none
  fast_connect: on

ld2410:

