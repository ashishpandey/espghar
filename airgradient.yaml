substitutions:
  name: airgradient
  friendly_name: airgradient
  ip_prefix: !secret ip_prefix
  ip_suffix: 213

packages:
  base: !include common/.base.yaml
  esp_info: !include common/.esp-info.yaml

esphome:
  name: airgradient
  name_add_mac_suffix: false
  friendly_name: airgradient

logger:
  level: debug

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_mode: dio
  framework:
    type: esp-idf

wifi:
  output_power: 8.5db
  power_save_mode: none
  fast_connect: on

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  id: bus_a
  frequency: 50kHz # Lower frequency helps stability on super mini boards
  sda_pullup_enabled: true
  scl_pullup_enabled: true

uart:
  - rx_pin: GPIO9
    tx_pin: GPIO8
    baud_rate: 9600
    id: uart_plantair   # platair
  - rx_pin: GPIO2
    tx_pin: GPIO0
    baud_rate: 9600
    id: uart_sensair   # sensair S8

sensor:
  - platform: sht4x
    temperature:
      id: temp
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
    # address: 0x44
    update_interval: 5s
  - platform: pmsx003
    type: PMSX003
    uart_id: uart_plantair
    pm_2_5:
      id: pm25
      name: "Particulate Matter <2.5µm Concentration"
  - platform: senseair
    uart_id: uart_sensair
    co2:
      id: co2
      name: "SenseAir CO2 Value"
    update_interval: 60s

font:
  - file: "gfonts://Silkscreen"
    id: small
    size: 10
  - file: "gfonts://Roboto"
    id: large
    size: 24
  - file: "gfonts://Silkscreen"
    id: medium
    size: 15

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      //   it.printf(0, 0, id(roboto_font), "%.1f°C", id(temp).state);
      //   it.printf(0, 16, id(roboto_font), "%.1f%% RH", id(humidity).state);
      //   it.printf(0, 32, id(roboto_font), "%.0fppm", id(co2).state);
      //   it.printf(0, 48, id(roboto_font), "%.0f µg/m³", id(pm25).state);
      it.printf(0, 0, id(small), TextAlign::TOP_LEFT, "Time and");
      it.printf(0, 12, id(small), TextAlign::TOP_LEFT, "Temperature");

      // Print time in HH:MM format
      it.strftime(0, 60, id(large), TextAlign::BASELINE_LEFT, "%H:%M", id(co2).state);

      if (id(temp).has_state()) {
        it.printf(127, 23, id(medium), TextAlign::TOP_RIGHT , "%.1f °C", id(temp).state);
      }

      if (id(humidity).has_state()) {
        it.printf(127, 60, id(medium), TextAlign::BASELINE_RIGHT , "%.1f %%RH",
                  id(humidity).state, id(humidity).state.c_str());
      }
