substitutions:
  ip_prefix: !secret ip_prefix

api:
  reboot_timeout: 0s

# logger:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: "${ip_prefix}.${ip_suffix}"
    gateway: "${ip_prefix}.1"
    subnet: 255.255.255.0

button:
  - platform: factory_reset
    name: "Clear Flash Preferences"
    id: ResetButton
